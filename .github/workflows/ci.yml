name: Zenix CI/CD

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

concurrency:
  group: zenix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code (non-blocking)
        run: npm run lint --if-present || true

      - name: Type Check
        run: npm run type-check --if-present

      - name: Run Tests
        run: npm test --if-present

      - name: Build Project
        run: npm run build

      - name: Upload Build Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zenix-build
          path: dist

  deploy:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: frontend-ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render Deploy
        run: curl -X POST https://api.render.com/deploy/srv-d6knel95pdvs7385d52g?key=UDbvEV9pmUw

  notify:
    name: Notify on PR Merge
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true

    steps:
      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "PR Merged 🚀 - Zenix"
          to: adityavarshney808@gmail.com
          from: Zenix CI/CD
          body: |
            A pull request has been merged.

            Repo: ${{ github.repository }}
            PR Title: ${{ github.event.pull_request.title }}
            Merged by: ${{ github.actor }}
            Link: ${{ github.event.pull_request.html_url }}
